# cargo-deny configuration
# Protects AGPL-3.0-or-later licensing

[advisories]
version = 2
ignore = [
    # Quadratic run time in quick-xml's duplicate-attribute check. Reached only
    # through wayland-scanner, which is a *proc-macro*: quick-xml runs at build
    # time over the Wayland protocol XML that ships inside the wayland crates --
    # fixed, local, trusted input. Exploiting this would mean feeding malicious
    # protocol XML into the build, which requires already controlling the build.
    #
    # Not fixable here: the fix is quick-xml >= 0.41, and wayland-scanner 0.31
    # pins `quick-xml ^0.39`, so `cargo update -p quick-xml` resolves nothing.
    # It has to arrive as wayland-rs -> winit -> eframe releases.
    #
    # Remove both entries once `cargo tree -i quick-xml` shows >= 0.41.
    { id = "RUSTSEC-2026-0194", reason = "build-time proc-macro parsing trusted protocol XML; upstream pin blocks the fix" },
    # Unbounded namespace-declaration allocation in the same quick-xml, reached
    # by the same build-time path, so the same reasoning and the same blocker.
    { id = "RUSTSEC-2026-0195", reason = "build-time proc-macro parsing trusted protocol XML; upstream pin blocks the fix" },

    # ttf-parser is unmaintained -- an absent upstream, not a known defect, and
    # the advisory itself says no safe upgrade exists. It arrives under egui's
    # text rasterisation (ttf-parser <- owned_ttf_parser <- ab_glyph <- epaint
    # <- egui), so it only ever parses the fonts this app hands it, and we hand
    # it none: there is no FontDefinitions/add_font call anywhere here, so egui
    # rasterises its own bundled faces. Nothing user-supplied reaches it.
    #
    # Drop this entry when egui moves off ttf-parser, or if a maintained fork
    # is adopted upstream.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained, not a vulnerability; parses only egui's bundled fonts; no upgrade exists" },
]

[licenses]
version = 2
confidence-threshold = 0.8

# Only permissive licenses for dependencies
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    # Added for the eframe/egui (nav) dependency tree. All permissive,
    # OSI-approved and/or FSF-Free; none are copyleft for our code:
    #   BSL-1.0          Boost Software License — arboard/clipboard-win/error-code
    #                    (clipboard support via egui-winit). MIT-like permissive.
    #   OFL-1.1          SIL Open Font License — the Ubuntu fonts bundled by
    #   Ubuntu-font-1.0  epaint_default_fonts (egui's default UI fonts). Font
    #                    redistribution licenses, not code copyleft.
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

# Denied by omission: GPL, LGPL, SSPL, proprietary, unknown
# AGPL-3.0-or-later is allowed for Reliquary's own crates via exceptions.

exceptions = [
    { name = "reliquary", allow = ["AGPL-3.0-or-later"] },
    { name = "reliquary-bluray", allow = ["AGPL-3.0-or-later"] },
    { name = "reliquary-cli", allow = ["AGPL-3.0-or-later"] },
    { name = "reliquary-makemkv", allow = ["AGPL-3.0-or-later"] },
    { name = "reliquary-nav", allow = ["AGPL-3.0-or-later"] },
    { name = "reliquary-tui", allow = ["AGPL-3.0-or-later"] },
    { name = "reliquary-web", allow = ["AGPL-3.0-or-later"] },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
